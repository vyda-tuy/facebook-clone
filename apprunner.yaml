version: 1.0
runtime: nodejs22
build:
  commands:
    build:
      - npm ci
      - npm run build
      - cp -r public .next/standalone/public
      - cp -r .next/static .next/standalone/.next/static
run:
  command: node .next/standalone/server.js
  network:
    port: 3000
  env:
    - name: NODE_ENV
      value: "production"
    - name: HOSTNAME
      value: "0.0.0.0"

